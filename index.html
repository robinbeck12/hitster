<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ZeitHit</title>
    <meta name="theme-color" content="#070607" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZeitHit" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="preload" href="./fonts/BebasNeue-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <!-- Hinweis/Fehler (unbekannte Karte, Kamera aus …): ein Tipp startet den Scanner -->
      <section class="screen" id="screen-start" hidden>
        <div class="screen-body">
          <h1 class="app-title" id="app-title">ZeitHit</h1>
          <p class="notice" id="start-notice" role="status" hidden></p>
        </div>
        <div class="screen-actions">
          <button class="btn btn-primary" id="btn-scan" type="button">Karte scannen</button>
        </div>
      </section>

      <!-- Scanner (startet automatisch) -->
      <section class="screen" id="screen-scanner" hidden>
        <div class="screen-body">
          <div class="reader-frame"><div class="reader" id="reader"></div></div>
          <p class="tagline" id="scan-hint">QR-Code der Karte in den Rahmen halten.</p>
          <p class="notice" id="scan-notice" role="status" hidden></p>
        </div>
        <div class="screen-actions">
          <button class="btn btn-primary" id="btn-scan-retry" type="button" hidden>Erneut versuchen</button>
        </div>
      </section>

      <!-- Player: Video liegt verdeckt unter dem Overlay -->
      <section class="screen" id="screen-player" hidden>
        <div class="screen-body">
          <div class="stage" id="stage">
            <div class="stage-video"><div id="yt-player"></div></div>
            <div class="stage-overlay" aria-hidden="true">
              <div class="eq">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <p class="notice" id="player-notice" role="status" hidden></p>
          <p class="tagline" id="play-hint" hidden>Zum Abspielen tippen</p>
        </div>

        <div class="screen-actions">
          <button class="btn-round" id="btn-play" type="button" aria-label="Abspielen">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
          </button>
          <button class="btn btn-secondary" id="btn-next" type="button">Nächste Karte</button>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
